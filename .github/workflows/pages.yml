name: Deploy to GitHub Pages

# Builds the landing page and publishes it to https://<owner>.github.io/<repo>/.
# One-time: Settings > Pages > Source: GitHub Actions.
# Optional: Settings > Secrets and variables > Actions > Variables > VITE_FLAGSMITH_ENV_KEY
# (client-side key, safe to expose). Without it the page runs in offline mode (control, no events).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_FLAGSMITH_ENV_KEY: ${{ vars.VITE_FLAGSMITH_ENV_KEY }}
          VITE_FLAGSMITH_API_URL: ${{ vars.VITE_FLAGSMITH_API_URL }}
          VITE_FLAGSMITH_EVENTS_URL: ${{ vars.VITE_FLAGSMITH_EVENTS_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
